server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively (hashed by Vite)
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|ttf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri /index.html;
    }
}


